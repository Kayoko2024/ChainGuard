# Optional observer-history overlay. Original chain config/genesis/keys stay unchanged.
# Apply one validator at a time with scripts/enable_audit_history.py.
# This retains future trie logs; it cannot recreate already-pruned history.
services:
  node1:
    command: ["--config-file=/config/node.toml", "--p2p-host=172.30.44.11", "--bonsai-historical-block-limit=1000000", "--bonsai-limit-trie-logs-enabled=false"]
  node2:
    command: ["--config-file=/config/node.toml", "--p2p-host=172.30.44.12", "--bonsai-historical-block-limit=1000000", "--bonsai-limit-trie-logs-enabled=false"]
  node3:
    command: ["--config-file=/config/node.toml", "--p2p-host=172.30.44.13", "--bonsai-historical-block-limit=1000000", "--bonsai-limit-trie-logs-enabled=false"]
  node4:
    command: ["--config-file=/config/node.toml", "--p2p-host=172.30.44.14", "--bonsai-historical-block-limit=1000000", "--bonsai-limit-trie-logs-enabled=false"]
