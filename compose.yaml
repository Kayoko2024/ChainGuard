name: ${COMPOSE_PROJECT_NAME:-chainguard}
services:
  gateway:
    image: chainguard/gateway:0.1.0
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        PYTHON_IMAGE: ${CHG_PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.14.4-slim-bookworm@sha256:fc74d22ffd0d5ac395a4b7bdda75a4539758862c49ebf3005647084631e63789}
    environment:
      CHG_APP_ENV: container
      CHG_HOST: 0.0.0.0
      CHG_PORT: "8000"
      CHG_LOG_LEVEL: ${CHG_LOG_LEVEL:-info}
      CHG_SHUTDOWN_TIMEOUT: ${CHG_SHUTDOWN_TIMEOUT:-5}
    ports:
      - "127.0.0.1:${CHG_PORT:-8000}:8000"
    networks:
      - gateway_local
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    stop_grace_period: 10s
networks:
  gateway_local:
    driver: bridge
    internal: false
